<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-title" content="FuelLog">
    <title>Fuel Tracker: Monthly Pro</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231e1e2f%22/><text x=%2210%22 y=%2275%22 font-size=%2270%22>⛽</text></svg>?v=3">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231e1e2f%22/><text x=%2210%22 y=%2275%22 font-size=%2270%22>⛽</text></svg>?v=3">
    <meta name="theme-color" content="#1e1e2f">

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #4a1d1d 100%);
            background-attachment: fixed;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding: 25px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
        }

        h2, h3 { text-align: center; font-weight: 300; letter-spacing: 2px; margin-top: 0; }
        h3 { color: #00ff88; font-size: 18px; margin-top: 20px; }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
        }

        .btn-add { background: #00ff88; color: #121212; }
        .btn-reset { background: rgba(255, 68, 68, 0.15); color: #ff4444; border: 1px solid #ff4444; font-size: 12px; padding: 10px; }

        table { width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 14px; }
        th { font-size: 11px; color: rgba(255, 255, 255, 0.4); text-transform: uppercase; padding-bottom: 8px; text-align: left; }
        td { padding: 10px 5px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

        .report-card {
            background: rgba(0, 255, 136, 0.05);
            border-radius: 15px;
            padding: 15px;
            margin-top: 10px;
            border: 1px solid rgba(0, 255, 136, 0.1);
        }

        .delete-btn { color: #ff4444; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚗 FUEL LOG</h2>
    
    <input type="number" id="km" placeholder="Ujeto km" inputmode="numeric">
    <input type="number" id="spotreba" placeholder="Spotřeba (l/100km)" step="0.1" inputmode="decimal">
    <input type="number" id="cena" placeholder="Cena za litr (Kč)" inputmode="numeric">
    <input type="number" id="tankovano" placeholder="Natankováno litrů" inputmode="numeric">
    
    <button class="btn-add" onclick="pridatJizdu()">Přidat jízdu</button>

    <table id="tabulkaJizd">
        <thead>
            <tr>
                <th>KM</th>
                <th>Cena</th>
                <th>Datum</th>
                <th></th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="container">
    <h3>📅 MĚSÍČNÍ PŘEHLED</h3>
    <div id="mesicniReporty"></div>
    <button class="btn-reset" onclick="vymazatHistorii()" style="margin-top: 20px;">Vymazat celou historii</button>
</div>

<script>
    let jizdy = JSON.parse(localStorage.getItem('mojeJizdy')) || [];

    window.onload = aktualizujUI;

    function pridatJizdu() {
        const km = parseFloat(document.getElementById('km').value);
        const spotreba = parseFloat(document.getElementById('spotreba').value);
        const cenaPaliva = parseFloat(document.getElementById('cena').value);
        const tankovano = parseFloat(document.getElementById('tankovano').value) || 0;

        if (isNaN(km) || isNaN(spotreba) || isNaN(cenaPaliva)) {
            alert("Doplň data!");
            return;
        }

        const dnes = new Date();
        const novaJizda = {
            km: km,
            cena: (km / 100) * spotreba * cenaPaliva,
            datum: dnes.toISOString(),
            mesicRok: dnes.toLocaleString('cs-CZ', { month: 'long', year: 'numeric' })
        };

        jizdy.push(novaJizda);
        localStorage.setItem('mojeJizdy', JSON.stringify(jizdy));
        aktualizujUI();
        
        // Vymazat pole
        document.getElementById('km').value = "";
    }

    function smazatJizdu(index) {
        if (confirm("Smazat?")) {
            jizdy.splice(index, 1);
            localStorage.setItem('mojeJizdy', JSON.stringify(jizdy));
            aktualizujUI();
        }
    }

    function vymazatHistorii() {
        if (confirm("Fakt všechno smazat?")) {
            jizdy = [];
            localStorage.setItem('mojeJizdy', JSON.stringify(jizdy));
            aktualizujUI();
        }
    }

    function aktualizujUI() {
        const tbody = document.querySelector('#tabulkaJizd tbody');
        const reportDiv = document.getElementById('mesicniReporty');
        tbody.innerHTML = "";
        reportDiv.innerHTML = "";
        
        const souhrny = {};

        jizdy.forEach((j, index) => {
            // Tabulka jízd
            const d = new Date(j.datum);
            const datumFormat = `${d.getDate()}.${d.getMonth()+1}.`;
            
            tbody.innerHTML += `<tr>
                <td>${j.km} km</td>
                <td>${j.cena.toFixed(0)} Kč</td>
                <td>${datumFormat}</td>
                <td><span class="delete-btn" onclick="smazatJizdu(${index})">×</span></td>
            </tr>`;

            // Logika pro měsíční souhrny
            if (!souhrny[j.mesicRok]) {
                souhrny[j.mesicRok] = { km: 0, kc: 0 };
            }
            souhrny[j.mesicRok].km += j.km;
            souhrny[j.mesicRok].kc += j.cena;
        });

        // Vykreslení měsíčních kartiček
        for (const [mesic, data] of Object.entries(souhrny)) {
            reportDiv.innerHTML += `
                <div class="report-card">
                    <div style="color: #00ff88; font-weight: bold; text-transform: capitalize;">${mesic}</div>
                    <div style="display: flex; justify-content: space-between; margin-top: 5px;">
                        <span>Najeto: <b>${data.km.toFixed(0)} km</b></span>
                        <span>Útrata: <b>${data.kc.toFixed(0)} Kč</b></span>
                    </div>
                </div>
            `;
        }
    }
</script>

</body>
</html>
